version: '3.8'

services:
  rental-db:
    image: postgres:15-alpine
    container_name: rental-db
    environment:
      POSTGRES_DB: rental_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: your_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  rental-api:
    build:
      context: .
      dockerfile: Source/Backend/Rental.Api/Dockerfile
    container_name: rental-api
    ports:
      - "5000:80"
    environment:
      - ConnectionStrings__DefaultConnection=Host=rental-db;Database=rental_db;Username=postgres;Password=your_password
    depends_on:
      - rental-db

  rental-web:
    build:
      context: ./Source/Frontend
    container_name: rental-web
    ports:
      - "3000:80"
    depends_on:
      - rental-api

volumes:
  postgres_data:
